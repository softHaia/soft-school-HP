<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>お問い合わせ</h1>
    <p>ご質問・ご相談など、お気軽にお問い合わせください。</p>
  </header>

  <main>
    <section class="card">
      <form>
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" placeholder="お名前を入力">

        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="example@example.com">

        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" rows="6" placeholder="お問い合わせ内容を入力"></textarea>

        <button type="button" onclick="alert('現在はサンプルフォームです。')">
          送信する
        </button>
      </form>

      <p class="note">
        ※このフォームはサンプルです。実際にメールを送信するには、フォーム送信サービスなどの設定が必要です。
      </p>

      <a href="index.html">← トップページへ戻る</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 サンプルホームページ</p>
  </footer>

</body>
</html>
